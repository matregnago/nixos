[bar]
density = "compact"
marginHorizontal = 5
marginVertical = 5
outerCorners = true
position = "top"
showCapsule = false

    [bar.widgets]
    center = [ "clock", "date" ]
    end = [ "media", "notifications", "network", "volume", "battery", "session" ]
    margin_edge = 0
    margin_ends = 0
    start = [ "control-center", "workspaces", "sysmon", "weather" ]
    widget_spacing = 12

[dock]
enabled = false

[location]
auto_locate = true

[plugins]
enabled = [ "noctalia/bongocat" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "~/nixos-config/images/avatar/cat.jpg"
screen_time_enabled = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"

[wallpaper]
directory = "~/nixos-config/images/wallpapers"
enabled = true

    [wallpaper.default]
    path = "~/nixos-config/images/wallpapers/wallhaven-qr327r_2560x1080.png"

[widget.battery]
display_mode = "graphic"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.date]
format = "{:%a, %d %b %y}"

[widget.media]
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.sysmon]
show_value = true
visualization = "none"

[widget.weather]
show_condition = false
